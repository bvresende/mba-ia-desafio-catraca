services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catraca
      POSTGRES_PASSWORD: catraca
      POSTGRES_DB: catraca
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catraca -d catraca"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://catraca:catraca@db:5432/catraca"
      PARTNER_API_KEY: "catraca-partner-dev-key-2026"
      SESSION_COOKIE_NAME: "catraca_session"
      SESSION_TTL_HOURS: "24"
      GATEWAY_FAST_MIN_MS: "2000"
      GATEWAY_FAST_MAX_MS: "5000"
      GATEWAY_SLOW_MIN_MS: "30000"
      GATEWAY_SLOW_MAX_MS: "40000"

volumes:
  pgdata:
